services:

  user-service:
    build: ./user-service
    ports:
      - "3001:3000"

  order-service:
    build: ./order-service
    ports:
      - "3002:3000"

  database:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: microservices
    ports:
      - "5432:5432"